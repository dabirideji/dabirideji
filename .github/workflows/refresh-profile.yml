name: Refresh profile stats

# Twice a day: the second run commits only if the numbers moved since the
# first, and it covers a day where GitHub's scheduler skipped the first run.
# Contribution days are counted in UTC.
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "43 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh_profile.py
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh README stats
        run: python scripts/refresh_profile.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change today - nothing to commit."
            exit 0
          fi
          # Authored with the account's noreply address so the commit is
          # attributed to the profile owner.
          git config user.name "Uthman Ayodeji Dabiri"
          git config user.email "115591934+dabirideji@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): refresh stats $(date -u +%F)"
          git push
